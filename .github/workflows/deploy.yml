name: Deploy Backend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH Key to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== Starting 6T MATH Backend Deployment ==="
            TARGET_DIR="/var/www/backend-6t-math"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Initialize or sync with git repository
            if [ ! -d ".git" ]; then
              echo "Initializing Git in existing directory..."
              git init
              git remote add origin https://github.com/dodd-maindev/Backend_6T_Math.git || git remote set-url origin https://github.com/dodd-maindev/Backend_6T_Math.git
            fi

            echo "Fetching and resetting to latest origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Build and restart service
            if command -v docker &> /dev/null && [ -f "docker-compose.yml" ]; then
              echo "Deploying via Docker Compose..."
              docker compose up -d --build
            else
              echo "Deploying via Native Systemd..."
              source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
              cargo build --release
              systemctl restart backend-6t-math || true
            fi

            echo "=== Deployment Completed Successfully! ==="
