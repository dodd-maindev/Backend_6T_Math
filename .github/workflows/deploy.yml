name: Deploy Backend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH Key to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== Starting 6T MATH Backend Deployment ==="
            TARGET_DIR="/var/www/backend-6t-math"
            
            # 1. Clone repository if not exists, otherwise pull latest changes
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              mkdir -p /var/www
              git clone https://github.com/dodd-maindev/Backend_6T_Math.git $TARGET_DIR
            else
              echo "Pulling latest code from main branch..."
              cd $TARGET_DIR
              git fetch origin main
              git reset --hard origin/main
            fi

            cd $TARGET_DIR

            # 2. Build and restart service
            if command -v docker &> /dev/null && [ -f "docker-compose.yml" ]; then
              echo "Deploying via Docker Compose..."
              docker compose up -d --build
            else
              echo "Deploying via Native Systemd..."
              source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
              cargo build --release
              systemctl restart backend-6t-math || true
            fi

            echo "=== Deployment Completed Successfully! ==="
