name: Deploy Backend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH Key to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p /var/www/backend-6t-math
            cd /var/www/backend-6t-math
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/dodd-maindev/Backend_6T_Math.git || git remote set-url origin https://github.com/dodd-maindev/Backend_6T_Math.git
            fi
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
